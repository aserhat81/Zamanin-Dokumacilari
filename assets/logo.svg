<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Zamanın Dokumacıları</title>
  <desc id="desc">Üç iç içe altın halka ve kitap adı</desc>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.45" stop-color="#e8bd55"/>
      <stop offset="1" stop-color="#b77a18"/>
    </linearGradient>
  </defs>

  <g transform="translate(35 22)" fill="none" stroke="url(#gold)" stroke-width="13" filter="url(#glow)">
    <circle cx="150" cy="105" r="78"/>
    <circle cx="105" cy="180" r="78"/>
    <circle cx="195" cy="180" r="78"/>
  </g>

  <g transform="translate(42 252)" stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M25 0 C90 -18 210 -18 275 0"/>
    <path d="M25 18 C90 0 210 0 275 18"/>
    <path d="M25 36 C90 18 210 18 275 36"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="8"
     fill="url(#gold)" stroke="#071426" stroke-width="2" paint-order="stroke fill">
    <text x="355" y="145" font-size="92">ZAMANIN</text>
    <text x="355" y="255" font-size="92">DOKUMACILARI</text>
  </g>
</svg>
