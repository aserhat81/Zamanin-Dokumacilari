<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">Zamanın Dokumacıları</title>
  <desc id="desc">Üç iç içe altın halka ve okunaklı kitap adı</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.48" stop-color="#e8bd55"/>
      <stop offset="1" stop-color="#b87918"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(38 18)" fill="none" stroke="url(#gold)" stroke-width="13"
     stroke-linecap="round" filter="url(#softGlow)">
    <circle cx="150" cy="92" r="72"/>
    <circle cx="108" cy="164" r="72"/>
    <circle cx="192" cy="164" r="72"/>
  </g>

  <g transform="translate(65 245)" stroke="url(#gold)" stroke-width="5"
     fill="none" stroke-linecap="round">
    <path d="M15 0 C75 -15 185 -15 245 0"/>
    <path d="M15 17 C75 2 185 2 245 17"/>
  </g>

  <text x="335" y="180"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="94"
        font-weight="700"
        letter-spacing="4"
        fill="url(#gold)"
        stroke="#071426"
        stroke-width="2"
        paint-order="stroke fill">ZAMANIN DOKUMACILARI</text>

  <path d="M338 216 H1518" stroke="#e8bd55" stroke-width="3" opacity=".7"/>
</svg>
